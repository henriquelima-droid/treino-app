 eddel:()=>{const p=ui.ed.p;if(S.plan.id===p.id){toast(L('Troque de programa antes de excluir este','Switch programs before deleting this one'));return;}modal(L('Excluir programa?','Delete program?'),'',[{l:L('Cancelar','Cancel'),fn:closeModal},{l:L('Excluir','Delete'),c:'primary',fn:()=>{S.library=S.library.filter(x=>x.id!==p.id);persist('library');ui.ed=null;closeModal();ui.tab='progs';render();}}]);},
 edw:b=>{ui.ed.w=b.dataset.v;ui.ed.openEx={};render();},
 edwadd:()=>{const p=ui.ed.p;const used=Object.keys(p.workouts).map(k=>p.workouts[k].label||k);const letters='ABCDEFGH'.split('').filter(x=>!used.includes(x)&&!p.workouts[x]);if(!letters.length){toast(L('Máximo de 8 treinos','Up to 8 workouts'));return;}const c=letters[0];p.workouts[c]={label:c,name:L('Treino ','Workout ')+c,focus:'',exercises:[]};ui.ed.w=c;render();},
 edwdel:()=>{const p=ui.ed.p,c=ui.ed.w;modal(L('Excluir este treino?','Delete this workout?'),'',[{l:L('Cancelar','Cancel'),fn:closeModal},{l:L('Excluir','Delete'),c:'primary',fn:()=>{delete p.workouts[c];p.phases.forEach(ph=>{ph.schedule=ph.schedule.map(x=>x===c?'rest':x);});ui.ed.w=Object.keys(p.workouts)[0];closeModal();render();}}]);},
 edexo:b=>{const i=+b.dataset.i;ui.ed.openEx[i]=!ui.ed.openEx[i];render();},
 edmv:b=>{const w=edW(),i=+b.dataset.i,j=i+(+b.dataset.v);if(j<0||j>=w.exercises.length)return;const x=w.exercises.splice(i,1)[0];w.exercises.splice(j,0,x);ui.ed.openEx={};render();},
 edexdel:b=>{const w=edW(),i=+b.dataset.i;const e=w.exercises[i];if(e.superset)w.exercises.forEach(x=>{if(x.superset===e.superset)delete x.superset;});w.exercises.splice(i,1);ui.ed.openEx={};render();},
 edexadd:()=>openExPicker(),
 edpick:b=>{const e=catalog()[b.dataset.id];if(e)addExToEditor(e);},
 edcustom:()=>{const q=($('#pk-q')&&$('#pk-q').value.trim())||L('Novo exercício','New exercise');addExToEditor({id:'x-'+uid(),name:q,sets:3,reps:'8–12',repMin:8,repMax:12,rir:'1–2',rest:90,group:'peito',compound:false,note:'',sub:'',scheme:'straight'});},
 edset:b=>{const e=edW().exercises[+b.dataset.i];e[b.dataset.k]=b.dataset.v;render();},
 edtog:b=>{const w=edW(),i=+b.dataset.i,e=w.exercises[i],k=b.dataset.k;
   if(k==='feed'){if(e.feeders&&e.feeders.length){delete e.feeders;e.scheme='straight';}else{e.feeders=[{pct:50,reps:10},{pct:75,reps:5}];e.scheme='topBackoff';}}
   else if(k==='uni'){e.uni=!e.uni;}
   else if(k==='pair'){const nx=w.exercises[i+1];if(e.superset&&nx&&nx.superset===e.superset){delete e.superset;delete nx.superset;}else{w.exercises.forEach(x=>{if(x!==e&&x!==nx&&(x.superset===e.superset||x.superset===nx.superset))delete x.superset;});const code=String(ui.ed.w)+(i+1)+'s';e.superset=code;nx.superset=code;}}
   render();},
 eddl:()=>{const p=ui.ed.p;p.edDeload=p.edDeload===false?true:false;edPhasesSync();render();},
 edday:b=>{const p=ui.ed.p,ph=p.phases[+b.dataset.p],i=+b.dataset.i;const opts=[...Object.keys(p.workouts),'cardio','rest'];const cur=opts.indexOf(ph.schedule[i]);ph.schedule[i]=opts[(cur+1)%opts.length];if(p.edSimple)edPhasesSync();render();},
 phday:b=>{S.prefs.photoDay=+b.dataset.v;persist('prefs');render();if(IN_APP)scheduleReminders(false);},
 cmppose:b=>{ui.cmpPose=b.dataset.v;render();},
 cmpa:b=>{ui.cmpA=b.dataset.v;render();},
 cmpb:b=>{ui.cmpB=b.dataset.v;render();},
 phedit:b=>{ui.phEdit=ui.phEdit===b.dataset.v?null:b.dataset.v;render();},
 phadd:b=>{ui.photoDate=b.dataset.v;ui.phEdit=null;render();setTimeout(()=>{const e=$('#ph-new');e&&e.scrollIntoView({behavior:'smooth',block:'start'});},60);},
 phgo:b=>{ui.photoDate=b.dataset.v;render();},
 phdraftdel:(b,ev)=>{ev.preventDefault();ev.stopPropagation();const id=b.dataset.id;delImg(id);S.media.draft=(S.media.draft||[]).filter(x=>x.id!==id);persist('media');render();},
 phdiscard:()=>{const d=ui.photoDate,dr=draftsOn(d);modal(L('Descartar fotos?','Discard photos?'),`<p>${dr.length} ${L('fotos ainda não salvas serão removidas. O histórico não é alterado.','unsaved photos will be removed. History is not changed.')}</p>`,[{l:L('Cancelar','Cancel'),fn:closeModal},{l:L('Descartar','Discard'),c:'primary',fn:()=>{dr.forEach(x=>delImg(x.id));S.media.draft=(S.media.draft||[]).filter(x=>x.date!==d);persist('media');closeModal();render();}}]);},
 phsave:async()=>{const d=ui.photoDate,dr=draftsOn(d);if(!dr.length)return;toast(L('Salvando…','Saving…'));let ok=0;
   let n=Math.max(0,...S.media.photos.filter(x=>x.date===d&&x.pose==='extra').map(x=>x.n||0));
   for(const x of dr.sort((a,b)=>(a.n||0)-(b.n||0))){const data=await getImg(x.id);if(!data)continue;
     const id=x.pose==='extra'?'ph-'+d+'-x'+uid():photoId(d,x.pose);
     if(await putImg(id,data,{date:d,pose:x.pose})){S.media.photos=S.media.photos.filter(y=>y.id!==id);const rec={id,date:d,pose:x.pose};if(x.pose==='extra')rec.n=++n;S.media.photos.push(rec);
       S.media.draft=S.media.draft.filter(y=>y.id!==x.id);delImg(x.id);ok++;}}
   persist('media');render();toast(ok===1?L('1 foto salva no histórico','1 photo saved to history'):ok+L(' fotos salvas no histórico',' photos saved to history'));},
 phview:b=>{const id=b.dataset.id,ph=S.media.photos.find(x=>x.id===id);if(!ph)return;
   modal(fmtLong(ph.date)+' · '+poseName(ph.pose),`<img class="bigimg" data-img="${id}" alt="">`,[{l:L('Excluir','Delete'),fn:()=>{modal(L('Excluir foto?','Delete photo?'),'',[{l:L('Cancelar','Cancel'),fn:closeModal},{l:L('Excluir','Delete'),c:'primary',fn:()=>{delImg(id);S.media.photos=S.media.photos.filter(x=>x.id!==id);persist('media');closeModal();render();}}]);}},{l:L('Fechar','Close'),c:'primary',fn:closeModal}]);},
 repd:b=>{ui.repDays=b.dataset.v==='all'?'all':+b.dataset.v;ui.report=null;render();},
 repgen:()=>{ui.report=buildReport(ui.repDays);render();setTimeout(()=>{const r=$('#rep');r&&r.scrollIntoView();},30);},
 repcopy:()=>ui.report&&copyText(ui.report.md),
 repmd:()=>ui.report&&download(`${L('relatorio-treino','training-report')}-${ui.report.end}.md`,ui.report.md),
 repjson:()=>ui.report&&download(`${L('relatorio-treino','training-report')}-${ui.report.end}.json`,JSON.stringify(ui.report.json,null,2)),
 plimp:()=>{const t=$('#pl-in').value.trim();if(!t){toast(L('Cole o JSON do plano ou escolha o arquivo','Paste the plan JSON or choose the file'));return;}importPlanText(t);},
 plcopy:()=>copyText(JSON.stringify(S.plan,null,2)),
 plstart:()=>{const v=$('#pl-start').value.trim();if(!isDate(v)){toast(L('Use AAAA-MM-DD','Use YYYY-MM-DD'));return;}S.plan.startDate=v;persist('plan');render();toast(L('Início atualizado','Start date updated'));},
 plreset:()=>modal(L('Restaurar plano original?','Restore original plan?'),'',[{l:L('Cancelar','Cancel'),fn:closeModal},{l:L('Restaurar','Restore'),c:'primary',fn:()=>{S.plan=clone(DEFAULT_PLAN);persist('plan');closeModal();render();}}]),
 saveprof:()=>{const g=id=>$('#'+id).value.trim();Object.assign(S.profile,{name:g('pf-name'),idade:num(g('pf-idade'))||S.profile.idade,altura:num(g('pf-alt'))||S.profile.altura,pesoInicial:num(g('pf-pi'))||S.profile.pesoInicial,metaMin:num(g('pf-mmin'))||S.profile.metaMin,metaMax:num(g('pf-mmax'))||S.profile.metaMax});persist('profile');toast(L('Perfil salvo','Profile saved'));},
 pref:b=>{const k=b.dataset.k;if(k==='theme'){A.theme();return;}S.prefs[k]=!S.prefs[k];persist('prefs');if(IN_APP&&k==='workoutReminder')scheduleReminders(true);b.querySelector('.sw').classList.toggle('on',!!S.prefs[k]);},
 bkdl:()=>download(`backup-treino-${today()}.json`,JSON.stringify(backupObj(),null,2)),
 bkcopy:()=>copyText(JSON.stringify(backupObj())),
 mbtn:b=>{const a=MA[+b.dataset.i];a&&a.fn();},
 mbg:(b,ev)=>{if(ev.target===b)closeModal();}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){if(b.tagName==='LABEL')ev.preventDefault();f(b,ev);}});
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.dataset&&el.dataset.f2==='pick'){const l=$('#pk-list');if(l)l.innerHTML=pickList(el.value);return;}
  if(el.dataset&&el.dataset.ef&&ui.ed){const p=ui.ed.p,k=el.dataset.ef,v=el.value;
    if(k==='pname'){p.name=v;if(p.en)delete p.en.name;}else if(k==='pnotes'){p.notes=v;if(p.en)delete p.en.notes;}else if(k==='pweeks'){p.meta.weeks=parseInt(v)||p.meta.weeks;}
    else if(k==='wname'){edW().name=v;if(edW().en)delete edW().en.name;}else if(k==='wfocus'){edW().focus=v;if(edW().en)delete edW().en.focus;}
    else if(k==='x'){const e=edW().exercises[+el.dataset.i],f=el.dataset.k;e[f]=v;if(e.en&&(f==='name'||f==='note'||f==='sub'))delete e.en[f];}
    return;}
  if(el.dataset&&el.dataset.ob){const k=el.dataset.ob;S.profile[k]=k==='name'?el.value:el.value.replace(',','.');if(k==='pesoInicial'||k==='metaMax'){S.profile[k]=num(el.value)||'';if(k==='metaMax')S.profile.metaMin=S.profile.metaMax;}clearTimeout(window.__obT);window.__obT=setTimeout(()=>persist('profile'),500);return;}
  if(el.dataset&&el.dataset.pb){S.profile.pastBests=S.profile.pastBests||{};const v=num(el.value);if(v>0)S.profile.pastBests[el.dataset.pb]=v;else delete S.profile.pastBests[el.dataset.pb];clearTimeout(window.__pbT);window.__pbT=setTimeout(()=>persist('profile'),600);return;}
  const f=el.dataset&&el.dataset.f;if(!f||!S.active)return;
  if(f==='ldate'){S.active.date=el.value.trim();saveActive();return;}if(f==='ldur'){S.active.durationMin=el.value.replace(/\D/g,'');saveActive();return;}
  if(f==='kg'||f==='reps'){S.active.exercises[+el.dataset.e].sets[+el.dataset.s][f]=el.value.replace(/[^\d.,]/g,'');}
  else if(f==='cmin')S.active.cardio.min=el.value;else if(f==='bw')S.active.bodyweight=el.value;else if(f==='notes')S.active.notes=el.value;saveActive();});
document.addEventListener('change',async ev=>{const el=ev.target;
  if(el.dataset&&el.dataset.ef==='pweeks'&&ui.ed){edPhasesSync();render();return;}
  if(el.dataset&&el.dataset.f2==='phdate'){const v=el.value.trim();if(isDate(v)){ui.photoDate=v;render();}else toast(L('Use AAAA-MM-DD','Use YYYY-MM-DD'));return;}
  if(!el.dataset||!el.dataset.file||!el.files||!el.files[0])return;const file=el.files[0];const kind=el.dataset.file;
  if(kind==='photo'){const files=[...el.files];el.value='';if(!files.length)return;const direct=el.dataset.direct==='1';const date=direct?today():ui.photoDate,pose=el.dataset.pose,rid=el.dataset.id||'';
    if(!direct&&!S.media.draft)S.media.draft=[];
    const list=()=>direct?S.media.photos:S.media.draft,setList=v=>{if(direct)S.media.photos=v;else S.media.draft=v;};
    const pid=(dt,p)=>direct?photoId(dt,p):'phd-'+dt+'-'+p,xid=()=>(direct?'ph-':'phd-')+date+'-x'+uid();
    const empties=POSES.map(p=>p[0]).filter(p=>p!==pose&&!list().some(x=>x.date===date&&x.pose===p));
    const tg=files.map((f,k)=>{if(k===0)return pose==='extra'?{pose:'extra',id:rid||null}:{pose,id:pid(date,pose)};if(empties.length){const p=empties.shift();return{pose:p,id:pid(date,p)};}return{pose:'extra',id:null};});
    toast(files.length===1?L('Carregando foto…','Loading photo…'):L('Carregando ','Loading ')+files.length+L(' fotos…',' photos…'));let ok=0;
    let n=Math.max(0,...list().filter(x=>x.date===date&&x.pose==='extra').map(x=>x.n||0));
    for(let k=0;k<files.length;k++){const t=tg[k];try{const data=await compress(files[k],1100);const id=t.id||xid();
      const old=list().find(x=>x.id===id);const rec={id,date,pose:t.pose};if(t.pose==='extra')rec.n=old&&old.n?old.n:++n;
      if(await putImg(id,data,{date,pose:t.pose})){setList(list().filter(x=>x.id!==id).concat([rec]));ok++;}}catch(e){}}
    if(ok){persist('media');render();}
    toast(direct?(ok===1?L('1 foto salva','1 photo saved'):ok+L(' fotos salvas',' photos saved')):(ok===1?L('1 foto adicionada. Toque em “Salvar no histórico”.','1 photo added. Tap “Save to history”.'):ok+L(' fotos adicionadas. Toque em “Salvar no histórico”.',' photos added. Tap “Save to history”.')));return;}
  if(kind==='eximg'){toast(L('Salvando imagem…','Saving image…'));
    try{const data=await compress(file,kind==='photo'?1100:900);
      {const exId=el.dataset.id;if(await putImg('ex-'+exId,data,{exId})){S.media.ex[exId]=1;persist('media');if(S.active&&ui.tab==='workout'){const i=S.active.exercises.findIndex(e=>e.id===exId);if(i>=0)rerenderUnit(i);}else render();toast(L('Imagem salva','Image saved'));}}}
    catch(e){toast(L('Não foi possível ler a imagem','Could not read the image'));}
    el.value='';return;}
  const r=new FileReader();r.onload=()=>{const t=String(r.result);if(kind==='plan'){const ta=$('#pl-in');if(ta)ta.value=t;importPlanText(t);}else restoreBackup(t);el.value='';};r.readAsText(file);});


/* ---------- boot ---------- */
lsLoad();applyTheme();nativeInit();if(S.active)ui.tab='workout';render();ensureTick();connectP=connect();connectP.then(()=>{connectP=null;hydrate();if(!(ui.tab==='workout'&&S.active))photoReminder();});
})();

</script>
