<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Grow Up</title>
<style>
@font-face{font-family:'Oswald';font-weight:500;font-display:swap;src:url(fonts/oswald-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-weight:600;font-display:swap;src:url(fonts/oswald-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-weight:700;font-display:swap;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
</style>
<style>
:root{--red:#E10600;--red2:#FF1E1E;--red3:#B30000;--wine:#6E0B14;--orange:#FF5A1F;
  --bg:#0A0A0A;--s1:#141414;--s2:#1F1F1F;--s3:#2C2C2C;--tx:#F4F4F4;--mut:#A0A0A0;--mut2:#6B6B6B;
  --heroA:#220000;--heroB:#141414;--heroLine:#3a0a0a;--glass:rgba(0,0,0,.35);--redSoft:rgba(225,6,0,.16);--redTx:#FF6B66;--doneBg:#1c0606;--doneLine:#5a1212;
  --nav:rgba(10,10,10,.96);--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}
html[data-theme=light]{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EAEAEA;--s3:#D6D6D6;--tx:#0A0A0A;--mut:#5C5C5C;--mut2:#8E8E8E;
  --heroA:#FFE9E8;--heroB:#F5F5F5;--heroLine:#F3C4C2;--glass:rgba(255,255,255,.75);--redSoft:rgba(225,6,0,.10);--redTx:#B30000;--doneBg:#FFF1F0;--doneLine:#F0B3B0;
  --nav:rgba(255,255,255,.97);--shadow:0 10px 30px rgba(0,0,0,.15);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:92px;accent-color:var(--red);transition:background .2s}
body.wo-mode{padding-bottom:120px}
::selection{background:var(--red);color:#fff}
:focus{outline:none}:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
a,a:visited{color:var(--red2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--s3);border-radius:10px;padding:10px 12px;width:100%;caret-color:var(--red2);accent-color:var(--red);-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,6,0,.22)}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--s2) inset;-webkit-text-fill-color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--mut2)}
input[type=file]{padding:8px;font-size:13px}
input[type=file]::file-selector-button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:7px 12px;margin-right:10px;font-weight:600;cursor:pointer}
textarea{min-height:90px;resize:vertical}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 10px}
.hd{font-family:Oswald,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.brand{font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:22px;letter-spacing:.08em}.brand b{color:var(--red)}
.topr{display:flex;align-items:center;gap:8px}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2)}.dot.ok{background:var(--red)}.dot.warn{background:var(--orange)}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--heroA) 0%,var(--heroB) 65%);border-color:var(--heroLine);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;background:radial-gradient(circle,rgba(225,6,0,.32),transparent 70%);pointer-events:none}
.name{font-family:Oswald,Impact,sans-serif;font-size:30px;font-weight:700;line-height:1;text-transform:uppercase}
.sub{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--s2);color:var(--tx);border:1px solid var(--s3);white-space:nowrap}
.chip.red{background:var(--redSoft);border-color:rgba(225,6,0,.45);color:var(--redTx);font-weight:600}
.chip.solid{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{background:var(--glass);border-radius:12px;padding:10px}
.stat .v{font-family:Oswald,Impact,sans-serif;font-size:26px;font-weight:600;line-height:1.05}
.stat .v small{font-size:14px;color:var(--mut);font-family:Inter;font-weight:500}
.stat .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.seg{display:flex;background:var(--s1);border:1px solid var(--s2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px}
.seg button.on{background:var(--red);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--s2);border:1px solid var(--s3);color:var(--tx);font-size:14px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-family:Oswald,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:19px;font-weight:600}
.btn.primary:hover,.btn.primary:active{background:var(--red3);border-color:var(--red3)}
.btn.outline{background:transparent;border-color:var(--red);color:var(--redTx)}
.btn.block{width:100%}.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}.row.wrapx{flex-wrap:wrap}.grow{flex:1}
.navd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.navd .lbl{font-family:Oswald,Impact,sans-serif;font-size:17px;text-transform:uppercase;text-align:center;flex:1;line-height:1.15}
.navd .lbl small{display:block;font-family:Inter;text-transform:none;font-size:12px;color:var(--mut)}
.iconbtn{width:40px;height:40px;border-radius:11px;background:var(--s1);border:1px solid var(--s2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.wk{font-family:Oswald,Impact,sans-serif;font-size:42px;font-weight:700;line-height:.95;text-transform:uppercase}.wk span{color:var(--red)}
.exl{margin-top:12px}
.exi{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--s2)}
.exi .n{font-weight:600;font-size:14px}.exi .m{color:var(--mut);font-size:12px}
.exi .r{font-family:Oswald,Impact,sans-serif;font-size:17px;white-space:nowrap;text-align:right}
.exi .r small{display:block;font-family:Inter;font-size:11px;color:var(--mut)}
.ss{font-size:10px;font-weight:700;color:#fff;background:var(--wine);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
html[data-theme=light] .ss{background:var(--red3)}
.empty{color:var(--mut);font-size:13px;padding:14px 0;text-align:center}
.lbl2{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin:14px 0 6px}
.weekl .wd{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--s2);margin-bottom:6px;width:100%;text-align:left}
.weekl .wd.today{border-color:var(--red)}
.wd .dn{width:42px;text-align:center;flex:none}.wd .dn b{display:block;font-family:Oswald,Impact,sans-serif;font-size:22px;line-height:1}.wd .dn span{font-size:11px;color:var(--mut);text-transform:uppercase}
.wd .tag{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:Oswald,Impact,sans-serif;font-size:20px;font-weight:700;flex:none;border:2px solid var(--s3);color:var(--mut)}
.tag.wo{border-color:var(--red);color:var(--redTx)}.tag.done{background:var(--red);border-color:var(--red);color:#fff}
.tag.cd{font-size:11px}.tag.cd.done{background:var(--wine);border-color:var(--wine);color:#fff}
.wd .tx{flex:1;min-width:0}.wd .tx b{display:block;font-size:14px}.wd .tx span{font-size:12px;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .h{font-size:10.5px;color:var(--mut);text-align:center;text-transform:uppercase;padding:4px 0;font-weight:600}
.mc{aspect-ratio:1/1.1;border-radius:9px;background:var(--s1);border:1px solid var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;font-size:12px}
.mc.blank{background:transparent;border-color:transparent}
.mc.today{border-color:var(--red);border-width:2px}
.mc .c{font-family:Oswald,Impact,sans-serif;font-size:14px;font-weight:700;color:var(--redTx);line-height:1}
.mc .c.cd{font-family:Inter;font-size:9px;color:var(--mut);font-weight:600}
.mc.done{background:var(--red);border-color:var(--red);color:#fff}.mc.done .c{color:#fff}
.mc.cdone{background:var(--wine);border-color:var(--wine);color:#fff}.mc.cdone .c{color:#fff}
.mc.past:not(.done):not(.cdone) .c{opacity:.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.banner{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;width:100%;text-align:left}
.banner b{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:16px;display:block}
.banner span{font-size:12px;opacity:.9}
.pulse{width:10px;height:10px;border-radius:50%;background:#fff;animation:pl 1.2s infinite;flex:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--s2);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(10px)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 10px;font-weight:600}
.bnav button.on{color:var(--red2)}.bnav svg{width:23px;height:23px}
/* workout */
.wo-head{position:sticky;top:0;z-index:15;background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid var(--s2)}
.wo-head .in{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.wo-head .t{flex:1;min-width:0}.wo-head .t b{font-family:Oswald,Impact,sans-serif;font-size:20px;text-transform:uppercase;display:block;line-height:1.1}
.wo-head .t span{font-size:12px;color:var(--mut)}
.clock{font-family:Oswald,Impact,sans-serif;font-size:22px;font-weight:600;color:var(--redTx)}
.pbar{height:4px;background:var(--s2)}.pbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.exc{background:var(--s1);border:1px solid var(--s2);border-radius:16px;padding:14px;margin-bottom:12px}
.exc.complete{border-color:var(--red)}
.exc .eh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exc .en{font-family:Oswald,Impact,sans-serif;font-size:19px;text-transform:uppercase;line-height:1.15;font-weight:600}
.exc .en small{display:block;font-family:Inter;text-transform:none;font-size:12px;color:var(--orange);font-weight:600}
.exc .note{font-size:12.5px;color:var(--mut);margin-top:6px}
.lastp{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--s2)}
.lastp b{color:var(--redTx)}
.sug{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--red);color:#fff}
.sug.keep{background:var(--s3);color:var(--tx)}
.sethd{display:grid;grid-template-columns:46px 1fr 1fr 50px;gap:8px;margin-top:12px;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:center}
.setrow{display:grid;grid-template-columns:46px 1fr 1fr 50px;gap:8px;align-items:center;margin-top:7px}
.setrow input{text-align:center;font-family:Oswald,Impact,sans-serif;font-size:20px;padding:8px 4px;font-weight:600}
.setno{height:46px;border-radius:10px;background:var(--s2);font-family:Oswald,Impact,sans-serif;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--mut)}
.setno.top{background:var(--redSoft);color:var(--redTx);font-size:13px;letter-spacing:.05em;border:1px solid rgba(225,6,0,.5)}
.setno i{font-style:normal;font-family:Inter;font-size:9px;font-weight:600;margin-top:2px;text-transform:uppercase}
.chk{height:46px;border-radius:10px;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;color:var(--mut2)}
.chk svg{width:22px;height:22px}.chk.on{background:var(--red);border-color:var(--red);color:#fff}
.setrow.done input{border-color:var(--doneLine);background:var(--doneBg)}
.rpe{margin:8px 0 2px 54px}
.rpe .rl{font-size:11px;color:var(--mut);margin-bottom:5px}
.rpe .rb{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{min-width:38px;padding:7px 4px;border-radius:8px;background:var(--s2);border:1px solid var(--s3);font-weight:700;font-size:13px;flex:1}
.rpe button.on{background:var(--red);border-color:var(--red);color:#fff}
.exa{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.exa{display:grid!important;grid-template-columns:1fr 1fr}.exa .btn{min-width:0;white-space:nowrap;padding:9px 6px}
.btn.play{background:var(--red);border-color:var(--red);color:#fff}
.warm label{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--s2);font-size:14px;cursor:pointer}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.box.on{background:var(--red);border-color:var(--red)}.box svg{width:14px;height:14px}
.pillset{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:8px 13px;border-radius:999px;background:var(--s2);border:1px solid var(--s3);font-weight:600;font-size:13px}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.timerbar{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;background:var(--s1);border:2px solid var(--red);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:40;box-shadow:var(--shadow);overflow:hidden}
.timerbar.hidden{display:none}
.timerbar .tt{font-family:Oswald,Impact,sans-serif;font-size:40px;font-weight:700;min-width:100px;line-height:1;position:relative}
.timerbar .tl{flex:1;font-size:12px;color:var(--mut);position:relative;min-width:0}.timerbar .tl b{display:block;color:var(--tx);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timerbar .tc{display:flex;gap:6px;position:relative}
.timerbar .tc button{width:44px;height:44px;border-radius:11px;background:var(--s2);border:1px solid var(--s3);font-weight:700;font-size:13px}
.timerbar .tp{position:absolute;left:0;bottom:0;height:4px;background:var(--red)}
.timerbar.done{background:var(--red);color:#fff}.timerbar.done .tl,.timerbar.done .tl b{color:#fff}
.timerbar.done .tc button{background:rgba(0,0,0,.25);border-color:transparent;color:#fff}
/* charts & lists */
.chart svg{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--s2);border-radius:10px;padding:8px}
.kv b{font-family:Oswald,Impact,sans-serif;font-size:20px;display:block}.kv span{font-size:10.5px;color:var(--mut);text-transform:uppercase}
.vbar{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;margin-top:7px}
.vbar .tr{height:10px;border-radius:5px;background:var(--s2);overflow:hidden}.vbar .tr i{display:block;height:100%;background:var(--red);border-radius:5px}
.vbar .tr i.over{background:var(--orange)}
.vbar .nn{text-align:right;font-family:Oswald,Impact,sans-serif;font-size:15px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--s2);font-size:13.5px}
.pr b{font-family:Oswald,Impact,sans-serif;font-size:17px;color:var(--redTx);white-space:nowrap}
.hs{width:100%;text-align:left;display:block}
.hs .hh{display:flex;gap:12px;align-items:center}
.hs .det{margin-top:10px;font-size:13px;border-top:1px solid var(--s2);padding-top:8px}
.hs .det p{padding:3px 0}.hs .det p b{font-weight:600}
.field{margin-bottom:10px}.field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--s2);font-size:14px;width:100%;text-align:left}
.sw{width:46px;height:26px;border-radius:13px;background:var(--s3);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--red)}.sw.on::after{left:23px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{background:var(--s1);border:1px solid var(--s3);border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;font-size:22px;margin-bottom:8px}
.modal .mb{font-size:14px;color:var(--tx)}.modal .ma{display:flex;gap:8px;margin-top:16px}.modal .ma .btn{flex:1}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--red);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;transition:transform .25s;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{transform:translate(-50%,0)}
.themebtn svg{width:19px;height:19px}
.note-box{font-size:12.5px;color:var(--mut);background:var(--s2);border-radius:10px;padding:10px;margin-top:10px}

.sb{border:1px solid var(--s3);border-left:5px solid var(--s3);border-radius:13px;padding:10px 10px 10px 11px;margin-top:9px;background:var(--bg)}
.sb.t-feeder{border-left-color:var(--mut2)}.sb.t-top{border-left-color:var(--red);background:var(--redSoft)}.sb.t-backoff{border-left-color:var(--wine)}.sb.t-working{border-left-color:var(--orange)}.sb.t-final{border-left-color:var(--red2)}
html[data-theme=light] .sb.t-backoff{border-left-color:var(--red3)}
.sb.done{background:var(--doneBg);border-color:var(--doneLine)}
.sbh{display:flex;gap:10px;align-items:center}

/* ---------- cloud (db) ---------- */
let DB=null,sync='local',connectP=null;
const Q={};
function setSync(s){sync=s;const el=$('#syncl');if(el)el.outerHTML=syncHtml();}
function syncHtml(){const m={cloud:['ok',L('Salvo na nuvem','Saved to cloud')],connecting:['',L('Conectando…','Connecting…')],slow:['warn',L('Nuvem lenta','Cloud is slow')],error:['warn',L('Erro ao salvar','Save error')],}[sync];
  if(!m)return '<span id="syncl"></span>';
  return `<span class="sync" id="syncl"><i class="dot ${m[0]}"></i>${m[1]}</span>`;}
function dbPut(path,data){if(!DB)return;const e=Q[path]||(Q[path]={});e.data=clone(data);e.del=false;e.dirty=true;clearTimeout(e.t);e.t=setTimeout(()=>flush(path),500);}
function dbDel(path){if(!DB)return;const e=Q[path]||(Q[path]={});e.data=null;e.del=true;e.dirty=true;clearTimeout(e.t);e.t=setTimeout(()=>flush(path),150);}
async function flush(path){const e=Q[path];if(!e||e.running)return;e.running=true;
  while(e.dirty){e.dirty=false;const del=e.del,data=e.data;
    try{if(del)await DB.doc(path).delete();else await DB.doc(path).set(data);setSync('cloud');}
    catch(err){const c=err&&err.code;if(c==='unavailable'&&!e.retried){e.retried=true;if(!e.dirty){e.dirty=true;e.data=data;e.del=del;}await sleep(1200+Math.random()*800);continue;}
      setSync('error');if(c==='quota_exceeded')toast(L('Espaço da nuvem cheio — exporte um backup','Cloud storage full — export a backup'));}
    e.retried=false;}
  e.running=false;}
function persist(k){S.updated[k]=Date.now();lsSave();dbPut('app/'+k,{v:S[k],updatedAt:S.updated[k]});}
function saveSession(s){s.updatedAt=Date.now();const i=S.sessions.findIndex(x=>x.id===s.id);if(i>=0)S.sessions[i]=s;else S.sessions.push(s);lsSave();dbPut('sessions/'+s.id,s);}
function deleteSession(id){S.sessions=S.sessions.filter(s=>s.id!==id);S.tomb[id]=Date.now();lsSave();dbDel('sessions/'+id);}
async function connect(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}
  setSync('connecting');
  let db=null;try{db=await window.claude.use('db');}catch(e){}
  if(!db){setSync('local');return;}
  DB=db;const tm=setTimeout(()=>{if(sync==='connecting')setSync('slow');},10000);
  try{
    const keys=['profile','plan','body','active','prefs','media','library','measures'];
    const snaps=await Promise.all(keys.map(k=>db.doc('app/'+k).get()));
    const ss=await db.collection('sessions').limit(1000).get();
    clearTimeout(tm);let changed=false;
    keys.forEach((k,i)=>{const sn=snaps[i];
      if(sn.exists){const d=sn.data()||{};const ru=d.updatedAt||0,lu=S.updated[k]||0;
        if(ru>lu){S[k]=d.v==null?null:clone(d.v);S.updated[k]=ru;changed=true;}
        else if(lu>ru)dbPut('app/'+k,{v:S[k],updatedAt:lu});}
      else if(S.updated[k])dbPut('app/'+k,{v:S[k],updatedAt:S.updated[k]});});
    const map={};S.sessions.forEach(s=>map[s.id]=s);const remote={};
    ss.docs.forEach(d=>{remote[d.id]=d.data();});
    for(const id in remote){if(S.tomb[id]){dbDel('sessions/'+id);continue;}const r=remote[id];
      if(!map[id]||(r.updatedAt||0)>(map[id].updatedAt||0)){map[id]=clone(r);changed=true;}}
    for(const id in map){if(!remote[id])dbPut('sessions/'+id,map[id]);}
    S.sessions=Object.values(map);normAll();lsSave();setSync('cloud');
    if(changed){applyTheme();softRender();}
  }catch(err){clearTimeout(tm);setSync('error');}
}

/* ---------- images (photos + exercise figures) ---------- */
const IMGC={};
async function getImg(id){if(IMGC[id])return IMGC[id];
  if(connectP)await connectP;
  if(DB){try{const sn=await DB.doc('img/'+id).get();if(sn.exists){IMGC[id]=sn.data().data;return IMGC[id];}}catch(e){}}
  {const v=await idbGet(id);if(v){IMGC[id]=v;return v;}}
  try{const v=localStorage.getItem(LSI+id);if(v){IMGC[id]=v;return v;}}catch(e){}
  return null;}
async function putImg(id,data,meta){IMGC[id]=data;if(connectP)await connectP;
  if(DB){try{await DB.doc('img/'+id).set(Object.assign({data,updatedAt:Date.now()},meta||{}));setSync('cloud');return true;}
    catch(e){if(e&&e.code==='quota_exceeded'){toast(L('Espaço da nuvem cheio','Cloud storage full'));return false;}}}
  if(await idbPut(id,data))return true;
  try{localStorage.setItem(LSI+id,data);return true;}catch(e){toast(L('Sem espaço para salvar a imagem neste aparelho','No space to save the image on this device'));return false;}}
async function delImg(id){delete IMGC[id];idbDel(id);if(DB){try{await DB.doc('img/'+id).delete();}catch(e){}}try{localStorage.removeItem(LSI+id);}catch(e){}}
function hydrate(){document.querySelectorAll('img[data-img]').forEach(el=>{const id=el.dataset.img;if(IMGC[id]){el.src=IMGC[id];return;}
  getImg(id).then(src=>{if(src&&el.isConnected)el.src=src;});});}
async function compress(file,max,maxLen){max=max||1100;maxLen=maxLen||235000;const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    let W=img.naturalWidth,H=img.naturalHeight;const sc=Math.min(1,max/Math.max(W,H));W=Math.round(W*sc);H=Math.round(H*sc);let q=.82,d='';
    for(let k=0;k<10;k++){const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,0,0,W,H);d=c.toDataURL('image/jpeg',q);
      if(d.length<=maxLen)break;if(q>.55)q-=.08;else{W=Math.round(W*.85);H=Math.round(H*.85);}}
    return d;}finally{URL.revokeObjectURL(url);}}

/* ---------- plan logic ---------- */
function phaseFor(week){const Ph=S.plan.phases;const last=Math.max(...Ph.map(p=>p.to));let w=week;
  if(w>last){const rf=S.plan.repeatFromWeek||Ph[0].from;const len=last-rf+1;w=rf+((week-rf)%len);}
  return Ph.find(p=>w>=p.from&&w<=p.to)||Ph[Ph.length-1];}
function dayPlan(date){if(date<S.plan.startDate)return{pre:true,code:'pre',type:'pre',week:0,phase:null};
  const week=Math.floor(dd(date,weekStart(S.plan.startDate))/7)+1;const ph=phaseFor(week);const code=ph.schedule[pd(date).getDay()];
  return{week,phase:ph,code,type:S.plan.workouts[code]?'workout':code};}
function targets(code,dp){const w=S.plan.workouts[code];const ph=dp.phase||phaseFor(1);const week=dp.week||1;
  return w.exercises.map(e=>{let sets=e.sets;if(e.compound&&ph.compoundSetsDelta)sets+=ph.compoundSetsDelta;
    if(ph.setsFactor)sets=Math.ceil(sets*ph.setsFactor);sets=Math.max(1,sets);
    const opt=(e.bonusFromWeek&&week>=e.bonusFromWeek&&!ph.setsFactor&&!ph.compoundSetsDelta)?1:0;
    return Object.assign({},e,{sets,optional:opt,rir:ph.rirOverride||e.rir,tech:(ph.setsFactor||ph.rirOverride)?'':(e.tech||'')});});}
const ST={
 feeder:{n:['Aproximação','Feeder set'],short:['aproximação','feeder'],info:['Série de <b>aproximação</b>: prepara articulações e o padrão do movimento com a carga subindo aos poucos. Não conta como volume e <b>não deve cansar</b>: pare bem longe da falha. Descanse ~1 min e siga.','<b>Feeder set</b>: warms up the joints and the movement pattern with the load ramping up. It does not count as volume and <b>should not be tiring</b>: stop far from failure. Rest ~1 min and move on.']},
 top:{n:['Top set','Top set'],short:['top set','top set'],info:['<b>Top set</b>: a série mais pesada do dia, feita logo depois das aproximações, enquanto você está descansado. Faça a faixa de repetições no RIR alvo e <b>registre a dificuldade (RPE)</b>. É ela que guia a progressão.','<b>Top set</b>: the heaviest set of the day, done right after the feeders while you are fresh. Hit the rep range at the target RIR and <b>log the difficulty (RPE)</b>. It drives your progression.']},
 backoff:{n:['Back-off','Back-off'],short:['back-off','back-off'],info:['<b>Back-off</b>: tire ~10% da carga da top set e repita a faixa de repetições com o mesmo RIR. Acumula volume com menos fadiga.','<b>Back-off</b>: drop ~10% from the top set load and repeat the rep range at the same RIR. Builds volume with less fatigue.']},
 working:{n:['Série válida','Working set'],short:['válida','working'],info:['<b>Série válida</b>: mesma carga em todas, dentro da faixa de repetições e no RIR alvo. Quando todas chegarem ao topo da faixa, suba a carga.','<b>Working set</b>: same load on every set, within the rep range at the target RIR. When all sets hit the top of the range, add load.']},
 final:{n:['Série final','Final set'],short:['final','final'],info:['<b>Série final</b>: mesma carga das anteriores, mas aqui pode ir até a <b>falha técnica</b> (RIR 0): pare quando a próxima repetição sairia com a forma quebrada.','<b>Final set</b>: same load as before, but you may go to <b>technical failure</b> (RIR 0): stop when the next rep would break form.']}
};
const stN=t=>L(ST[t].n[0],ST[t].n[1]);
const OPT_INFO=()=>L(' <b>Opcional:</b> faça só se estiver recuperando bem.',' <b>Optional:</b> only if you are recovering well.');
const stype=s=>s.type||(s.top?'top':'working');
const isWork=s=>stype(s)!=='feeder';
function setSpecs(e){const out=[];(e.feeders||[]).forEach(f=>out.push({type:'feeder',pct:f.pct,targetReps:f.reps}));
  const tb=e.scheme?e.scheme==='topBackoff':!!(e.feeders&&e.feeders.length);const n=e.sets;
  for(let k=0;k<n;k++){let t;if(tb)t=k===0?'top':'backoff';else t=(k===n-1&&/^\s*0/.test(String(e.rir)))?'final':'working';out.push({type:t});}
  for(let k=0;k<(e.optional||0);k++)out.push({type:tb?'backoff':'working',optional:true});
  if(e.tech==='drop'){out.push({type:'drop'},{type:'drop'});}else if(e.tech==='restpause'){out.push({type:'rp'},{type:'rp'});}
  return out;}
let BK={feeder:[['aproximação','aproximações'],['feeder set','feeder sets']],top:[['top set','top sets'],['top set','top sets']],backoff:[['back-off','back-offs'],['back-off set','back-off sets']],working:[['válida','válidas'],['working set','working sets']],final:[['final','finais'],['final set','final sets']]};
function setBreakdown(sets){const c={};sets.forEach(s=>{const t=stype(s);c[t]=(c[t]||0)+1;});
  return ['feeder','top','backoff','working','final','drop','rp'].filter(t=>c[t]).map(t=>c[t]+' '+BK[t][LANG==='en'?1:0][c[t]>1?1:0]).join(' + ');}
function estMin(T){let s=5*60;T.forEach(e=>{s+=e.sets*(40+(e.superset?e.rest/2:e.rest))+(e.feeders?e.feeders.length*75:0);});return Math.round(s/60+(S.plan.cardio?S.plan.cardio.training.min:0));}
function sessionsOn(date){return S.sessions.filter(s=>s.date===date);}
function lastPerf(exId,before,excludeId){const list=S.sessions.filter(s=>s.type==='workout'&&s.date<=before&&s.exercises&&s.id!==excludeId).sort((a,b)=>(b.date.localeCompare(a.date))||((b.endedAt||0)-(a.endedAt||0)));
  for(const s of list){const e=s.exercises.find(x=>x.id===exId);if(e){const done=e.sets.filter(x=>x.done&&num(x.kg)!=null&&isMain(x));if(done.length)return{date:s.date,sets:done,ex:e};}}return null;}
function suggestion(lp,ex){if(!lp)return null;const reps=lp.sets.map(s=>num(s.reps)||0);if(!reps.length)return null;
  if(reps.every(r=>r>=ex.repMax))return{t:L('↑ Subir a carga hoje','↑ Add load today'),c:''};
  if(reps.some(r=>r<ex.repMin))return{t:L('Manter a carga e buscar a faixa','Keep the load, reach the range'),c:'keep'};
  return{t:L('Mesma carga, +1 repetição','Same load, +1 rep'),c:'keep'};}
function curWeight(){const b=[...S.body].sort((a,b)=>a.date.localeCompare(b.date));return b.length?b[b.length-1].kg:S.profile.pesoInicial;}
function avgWeight(end,days){days=days||7;const st=addD(end,-(days-1));const v=S.body.filter(b=>b.date>=st&&b.date<=end).map(b=>b.kg);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function setBody(date,kg){S.body=S.body.filter(b=>b.date!==date);S.body.push({date,kg});S.body.sort((a,b)=>a.date.localeCompare(b.date));persist('body');}

const sLabel=s=>s.label||wLabel(s.workout);

const exName=e=>e.swapped?P(e,'sub'):P(e,'name');
const woTitle=s=>S.plan.workouts[s.workout]?P(S.plan.workouts[s.workout],'name'):s.title;
const woFocus=s=>S.plan.workouts[s.workout]?P(S.plan.workouts[s.workout],'focus'):(s.focus||'');

function woPct(){const a=S.active;if(!a)return 0;const tot=a.exercises.reduce((n,e)=>n+e.sets.length,0),done=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);return tot?Math.round(done/tot*100):0;}
function setRest(e,s,nx){if(nx&&stype(nx)==='drop')return 0;if(nx&&stype(nx)==='rp')return 15;return stype(s)==='feeder'?60:e.rest;}
function refKg(e,lp){const tp=e.sets.find(s=>stype(s)==='top'&&num(s.kg)!=null);if(tp)return num(tp.kg);
  const w=e.sets.find(s=>isWork(s)&&num(s.kg)!=null);if(w)return num(w.kg);
  if(lp){const t=lp.sets.find(s=>stype(s)==='top')||lp.sets[0];if(t)return num(t.kg);}return null;}
function wIndex(e,j){return e.sets.slice(0,j).filter(isMain).length;}
function phKg(e,j,lp){const s=e.sets[j],t=stype(s);
  if(t==='feeder'){const r=refKg(e,lp);return r?decS(r25(r*s.pct/100)):'';}
  if(t==='backoff'){const tp=e.sets.find(x=>stype(x)==='top'&&num(x.kg)!=null);if(tp)return decS(r25(num(tp.kg)*0.9));}
  if(t==='drop'||t==='rp'){const pv=e.sets[j-1];const k=pv&&num(pv.kg);if(k)return decS(t==='drop'?Math.max(0,r25(k*0.8)):k);return '';}
  if(lp){const k=wIndex(e,j);const x=lp.sets[Math.min(k,lp.sets.length-1)];if(x)return x.kg;}
  if(j>0&&e.sets[j-1].kg!==''&&isWork(e.sets[j-1]))return e.sets[j-1].kg;return '';}
function phReps(e,j,lp){const s=e.sets[j];if(stype(s)==='feeder')return String(s.targetReps||'');if(stype(s)==='drop'||stype(s)==='rp')return '';

function setMeta(e,s,pk){const t=stype(s);

  if(t==='final')return `${e.reps} ${repU(e)} · ${L('até a falha','to failure')}`;
  if(t==='drop')return `−20%${pk?` (≈ ${pk} kg)`:''} · ${L('máximo de reps, sem descanso','max reps, no rest')}`;
  if(t==='rp')return `${L('mesma carga · mini-série após 15 s','same load · mini-set after 15 s')}`;

function rpeHint(rir){const n=String(rir).split(/[–-]/).map(x=>parseFloat(x));if(n.length>1&&isFinite(n[1]))return decS(10-n[1])+'–'+decS(10-n[0]);return isFinite(n[0])?decS(10-n[0]):'?';}

let T=null,tickI=null,AC=null,WL=null;
function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){if(!S.prefs.sound||!AC)return;try{const t0=AC.currentTime;[0,.25,.5].forEach((o,k)=>{const os=AC.createOscillator(),g=AC.createGain();os.type='square';os.frequency.value=k===2?1320:880;g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.25,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.18);os.connect(g).connect(AC.destination);os.start(t0+o);os.stop(t0+o+.2);});}catch(e){}}
function startTimer(sec,label,next){unlockAudio();T={end:Date.now()+sec*1000,total:sec,label,next,fired:false};const tb=$('#timerbar');tb.classList.remove('hidden','done');document.body.classList.add('has-timer');$('#tlb').textContent=label;$('#tls').textContent=next||L('Descanso','Rest');ensureTick();tick();}
function stopTimer(){T=null;document.body.classList.remove('has-timer');const tb=$('#timerbar');tb.classList.add('hidden');tb.classList.remove('done');}
function ensureTick(){if(!tickI)tickI=setInterval(tick,250);}
function tick(){const ck=$('#clock');if(ck&&S.active){const s=Math.floor((Date.now()-S.active.startedAt)/1000);ck.textContent=(s>=3600?Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60)):Math.floor(s/60))+':'+pad(s%60);}
  if(!T)return;const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));$('#tt').textContent=mmss(left);$('#tp').style.width=(100-left/T.total*100)+'%';
  if(left===0&&!T.fired){T.fired=true;beep();try{navigator.vibrate&&navigator.vibrate([300,120,300]);}catch(e){}$('#timerbar').classList.add('done');$('#tlb').textContent=L('Bora! Próxima série','Go! Next set');const t0=T;setTimeout(()=>{if(T===t0)stopTimer();},7000);}}
async function wake(on){try{if(on&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');}else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.active&&ui.tab==='workout')wake(true);});

function lineChart(series,h){h=h||170;const all=series.flatMap(s=>s.pts);if(!all.length)return `<div class="empty">${L('Sem dados ainda.','No data yet.')}</div>`;
  const xs=all.map(p=>pd(p.x).getTime());let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5;}
  const ys=all.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);const py=(y1-y0)*.18||1;y0-=py;y1+=py;
  const W=340,Lf=36,R=8,Tp=10,B=22;const X=t=>Lf+(t-x0)/(x1-x0)*(W-Lf-R),Y=v=>Tp+(1-(v-y0)/(y1-y0))*(h-Tp-B);
  let g='';for(let k=0;k<=3;k++){const v=y0+(y1-y0)*k/3,yy=Y(v);g+=`<line x1="${Lf}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--s3)" stroke-width="1"/><text x="${Lf-5}" y="${yy+3.5}" fill="var(--mut)" font-size="10" text-anchor="end">${fmtN(v)}</text>`;}
  g+=`<text x="${Lf}" y="${h-5}" fill="var(--mut)" font-size="10">${fmtD(ymd(new Date(x0)))}</text><text x="${W-R}" y="${h-5}" fill="var(--mut)" font-size="10" text-anchor="end">${fmtD(ymd(new Date(x1)))}</text>`;
  series.forEach(s=>{const pts=[...s.pts].sort((a,b)=>a.x.localeCompare(b.x));if(!pts.length)return;const path=pts.map((p,k)=>(k?'L':'M')+X(pd(p.x).getTime()).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots)pts.forEach(p=>{g+=`<circle cx="${X(pd(p.x).getTime()).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${s.color}"/>`;});});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg></div>`;}

  const best=Math.max(...done.map(x=>e1rm(num(x.kg),num(x.reps))));const top=done.find(x=>stype(x)==='top')||done[0];const heavy=done.reduce((a,b)=>num(b.kg)>num(a.kg)?b:a);

        if(s.cardio&&s.cardio.device&&s.cardio.device!=='Não fiz')h+=`<p><b>Cardio:</b> ${esc(devName(s.cardio.device))} ${esc(s.cardio.min)} min</p>`;}

/* ---------- report ---------- */
function buildReport(days){const end=today();let start;
  if(days==='all'){const ds=S.sessions.map(s=>s.date).sort();start=ds[0]||S.plan.startDate;}else start=addD(end,-(days-1));
  const ss=S.sessions.filter(s=>s.date>=start&&s.date<=end).sort((a,b)=>a.date.localeCompare(b.date)||(a.endedAt||0)-(b.endedAt||0));
  let planned=0;for(let d=start>S.plan.startDate?start:S.plan.startDate;d<=end;d=addD(d,1)){if(dayPlan(d).type==='workout')planned++;}
  const wos=ss.filter(s=>s.type==='workout'),cds=ss.filter(s=>s.type==='cardio');
  const cmin=cds.reduce((a,s)=>a+(num(s.cardio.min)||0),0)+wos.reduce((a,s)=>a+(s.cardio&&s.cardio.device&&s.cardio.device!=='Não fiz'?num(s.cardio.min)||0:0),0);
  const dp=dayPlan(end);const p=S.profile;const a7=avgWeight(end),p7=avgWeight(addD(end,-7));const dows=DOWS[LANG];
  const ph=S.media.photos.filter(x=>x.date>=start&&x.date<=end);
  const Lr=[];Lr.push(`# ${L('Relatório de treino','Training report')} — ${p.name}`);
  Lr.push(`${L('Período','Period')}: ${fmtDY(start)} – ${fmtDY(end)} · ${L('Plano','Plan')}: ${P(S.plan,'name')} (v${S.plan.version}) · ${dp.pre?L('antes do início','before start'):L('Semana ','Week ')+dp.week+' — '+phName(dp.phase)}`);
  Lr.push('',`## ${L('Resumo','Summary')}`,`- ${L('Musculação','Lifting')}: ${wos.length} ${L(wos.length===1?'sessão':'sessões',wos.length===1?'session':'sessions')} (${planned} ${L('planejadas','planned')})`,`- Cardio: ${cmin} min ${L('no total','total')} (${cds.length} ${L('sessões dedicadas','dedicated sessions')})`);
  Lr.push(`- ${L('Peso','Weight')}: ${L('média 7 dias','7-day avg')} ${fmtN(a7)} kg${a7!=null&&p7!=null?` (${a7-p7>0?'+':''}${fmtN(a7-p7)} kg ${L('vs 7 dias anteriores','vs previous 7 days')})`:''} · ${L('inicial','start')} ${fmtN(p.pesoInicial)} kg · ${L('meta','goal')} ${p.metaMin}–${p.metaMax} kg`);
  const bws=S.body.filter(b=>b.date>=start&&b.date<=end);if(bws.length)Lr.push(`- ${L('Pesagens','Weigh-ins')}: ${bws.map(b=>fmtD(b.date)+' '+fmtN(b.kg)).join(' · ')}`);
  {const mm=S.measures.filter(m=>m.date>=start&&m.date<=end);if(mm.length)Lr.push(`- ${L('Medidas','Measurements')}: `+mm.map(m=>fmtD(m.date)+' '+MFIELDS.filter(f=>m[f[0]]!=null).map(f=>L(f[1],f[2]).toLowerCase()+' '+fmtN(m[f[0]])+f[3]).join(', ')).join(' | '));}
  Lr.push(`- ${L('Fotos de progresso','Progress photos')}: ${ph.length?[...new Set(ph.map(x=>x.date))].map(fmtD).join(', '):L('nenhuma no período','none in period')}`);
  Lr.push('',`## ${L('Sessões','Sessions')}`);
  ss.forEach(s=>{const d=pd(s.date);
    if(s.type==='cardio'){Lr.push('',`### ${fmtD(s.date)} (${dows[d.getDay()].toLowerCase()}) — Cardio`,`- ${devName(s.cardio.device)}: ${s.cardio.min} min${s.cardio.fc?' · '+L('FC média ','avg HR ')+s.cardio.fc:''}`);if(s.notes)Lr.push(`- ${L('Obs.','Notes')}: ${s.notes}`);return;}
    Lr.push('',`### ${fmtD(s.date)} (${dows[d.getDay()].toLowerCase()}) — ${woTitle(s)} · ${L('Semana','Week')} ${s.week||'?'} · ${s.durationMin||'?'} min`);
    s.exercises.forEach(e=>{const g={};e.sets.filter(x=>x.done).forEach(x=>{const t=stype(x);(g[t]||(g[t]=[])).push(fmtN(num(x.kg))+'×'+x.reps);});const tp=e.sets.find(x=>stype(x)==='top'&&x.done),fn=e.sets.find(x=>stype(x)==='final'&&x.done);
      const parts=['feeder','top','backoff','working','final','drop','rp'].filter(t=>g[t]).map(t=>(t==='top'?'TOP':L(ST[t].short[0],ST[t].short[1]))+' '+g[t].join(', ')+(t==='top'&&tp&&tp.rpe!=null?' (RPE '+fmtN(tp.rpe)+')':'')+(t==='final'&&fn&&fn.rpe!=null?' (RPE '+fmtN(fn.rpe)+')':''));
      Lr.push(`- ${e.swapped?P(e,'sub')+' ('+L('no lugar de ','instead of ')+P(e,'name')+')':P(e,'name')} [${L('meta','target')} ${e.reps} @RIR ${e.rir}]: ${parts.join(' | ')||L('não feito','not done')}`);});
    if(s.cardio&&s.cardio.device&&s.cardio.device!=='Não fiz')Lr.push(`- ${L('Cardio pós','Post cardio')}: ${devName(s.cardio.device)} ${s.cardio.min||'?'} min`);
    if(s.notes)Lr.push(`- ${L('Obs.','Notes')}: ${s.notes}`);});
  const H=exHistory();const ids=Object.keys(H);
  if(ids.length){Lr.push('',`## ${L('Melhor 1RM estimado por exercício (histórico)','Best estimated 1RM per exercise (all time)')}`);ids.sort((a,b)=>H[b].best-H[a].best).forEach(id=>Lr.push(`- ${P(H[id].ex,'name')}: ${fmtN(H[id].best,0)} kg (${L('maior carga','heaviest')} ${fmtN(H[id].heavy.kg)}×${H[id].heavy.reps})`));}
  Lr.push('',L('(aproximação = séries de aquecimento específico, não contam como volume)','(feeder = ramp-up sets, not counted as volume)'));
  const json={measures:S.measures.filter(m=>m.date>=start&&m.date<=end),format:'treino-app/report@1',generatedAt:new Date().toISOString(),period:{start,end},profile:S.profile,plan:{id:S.plan.id,name:S.plan.name,version:S.plan.version,startDate:S.plan.startDate},sessions:ss,body:bws,photoDates:[...new Set(ph.map(x=>x.date))]};
  return{md:Lr.join('\n'),json,start,end};}

/* ---------- settings ---------- */
const isBuiltin=id=>id===DEFAULT_PLAN.id||PRESETS.some(p=>p.id===id)||String(id).startsWith('gen-');
function allPrograms(){const list=[DEFAULT_PLAN,...LEVELS.flatMap(l=>genFor(l[0]))];S.library.forEach(p=>{if(!list.some(x=>x.id===p.id))list.push(p);});if(!list.some(x=>x.id===S.plan.id))list.push(S.plan);return list;}
function progMeta(p){const m=p.meta||{};const s0=(p.phases&&p.phases[p.phases.length>1?p.phases.length-1:0]||{}).schedule||[];
  const days=m.days||s0.filter(c=>p.workouts[c]).length;return{split:m.split||Object.keys(p.workouts).join(''),days,minutes:m.minutes||'~60',weeks:m.weeks||Math.max(...p.phases.map(x=>x.to)),level:m.level?L(m.level[0],m.level[1]):'',desc:m.desc?L(m.desc[0],m.desc[1]):P(p,'notes')||''};}
function progDetail(p){const dows=DOWS[LANG];const groups=[];
  p.phases.forEach(ph=>{if(ph.setsFactor)return;const key=ph.schedule.join();const g=groups.find(x=>x.key===key);if(g){g.from=Math.min(g.from,ph.from);g.to=Math.max(g.to,ph.to);}else groups.push({key,from:ph.from,to:ph.to,s:ph.schedule});});
  let h='';groups.forEach(g=>{h+=`<div class="lbl2">${L('Semanas','Weeks')} ${g.from===g.to?g.from:g.from+'–'+g.to}</div><div class="sched">${g.s.map((c,i)=>`<div class="${p.workouts[c]?'w':c==='cardio'?'c':''}"><span>${dows[i]}</span><b>${p.workouts[c]?esc(wLabel(c,p)):c==='cardio'?'♥':'—'}</b></div>`).join('')}</div>`;});
  const dl=p.phases.find(x=>x.setsFactor);if(dl)h+=`<div class="sub" style="margin-top:6px">${L('Semana','Week')} ${dl.from}: deload (${L('metade das séries','half the sets')})</div>`;
  Object.keys(p.workouts).forEach(k=>{const w=p.workouts[k];h+=`<div class="wblk"><div class="wkh"><i>${esc(wLabel(k,p))}</i><div><b>${esc(P(w,'name'))}</b><span>${esc(P(w,'focus'))}</span></div></div><div class="exl">${dayList(w.exercises.map(e=>Object.assign({},e,{optional:0})))}</div></div>`;});
  if(P(p,'notes'))h+=`<div class="note-box">${esc(P(p,'notes'))}</div>`;return h;}
function progCard(p){const m=progMeta(p),cur=S.plan.id===p.id,op=ui.progOpen&&ui.progOpen[p.id];
  return `<div class="prog ${cur?'cur':''}"><div class="row" style="align-items:flex-start"><div class="grow"><b class="hd" style="font-size:17px;display:block">${esc(P(p,'name'))}</b><div class="sub">${esc(m.level)}${!isBuiltin(p.id)?(m.level?' · ':'')+(String(p.id).startsWith('custom-')?L('criado por você','created by you'):L('importado','imported')):''}</div></div>${cur?`<span class="chip solid">${L('Em uso','Active')}</span>`:''}</div>
     <div class="chips">${p.meta&&p.meta.quick?`<span class="chip solid">⚡ ${L('Rápido','Quick')}</span>`:''}<span class="chip red">${esc(m.split)}</span><span class="chip">${m.days}x/${L('semana','week')}</span><span class="chip">${esc(m.minutes)} min</span><span class="chip">${m.weeks} ${L('semanas','weeks')}</span></div>
     ${m.desc?`<div class="sub" style="margin-top:8px;color:var(--tx)">${esc(m.desc)}</div>`:''}
     <div class="row" style="margin-top:10px"><button class="btn sm grow" data-act="progview" data-id="${esc(p.id)}">${op?L('Ocultar','Hide'):L('Ver treinos','View')}</button><button class="btn sm grow" data-act="edopen" data-id="${esc(p.id)}">${L('Editar','Edit')}</button>${cur?'':`<button class="btn sm play grow" data-act="proguse" data-id="${esc(p.id)}">${L('Usar','Use')}</button>`}</div>
     ${op?progDetail(p):''}</div>`;}
function renderPrograms(){const pf=S.profile;const lv=ui.progLevel||pf.level;const dn=DOWS[LANG];

function validatePlan(o){const er=[];if(!o||typeof o!=='object')return[L('O conteúdo não é um objeto JSON.','Content is not a JSON object.')];
  if(o.format!=='treino-app/plan@1')er.push(L('Campo "format" deve ser "treino-app/plan@1".','"format" must be "treino-app/plan@1".'));
  if(!o.name)er.push(L('Falta "name".','Missing "name".'));if(!isDate(o.startDate))er.push(L('"startDate" deve estar no formato AAAA-MM-DD.','"startDate" must be YYYY-MM-DD.'));
  if(!o.workouts||!Object.keys(o.workouts).length)er.push(L('Falta "workouts".','Missing "workouts".'));
  else for(const k in o.workouts){const w=o.workouts[k];if(!Array.isArray(w.exercises)||!w.exercises.length)er.push(`${k}: ${L('sem exercícios','no exercises')}.`);
    else w.exercises.forEach((e,i)=>{if(!e.id||!e.name||!e.sets||!e.reps||e.repMin==null||e.repMax==null||!e.rest)er.push(`${k} #${i+1}: ${L('faltam campos','missing fields')} (id, name, sets, reps, repMin, repMax, rest).`);});}
  if(!Array.isArray(o.phases)||!o.phases.length)er.push(L('Falta "phases".','Missing "phases".'));
  else o.phases.forEach((p,i)=>{if(!Array.isArray(p.schedule)||p.schedule.length!==7)er.push(`${L('Fase','Phase')} ${i+1}: "schedule" ${L('precisa de 7 dias (dom→sáb).','needs 7 days (Sun→Sat).')}`);
    else p.schedule.forEach(c=>{if(c!=='rest'&&c!=='cardio'&&!(o.workouts&&o.workouts[c]))er.push(`${L('Fase','Phase')} ${i+1}: "${c}" ${L('não existe','does not exist')}.`);});});
  if(!Array.isArray(o.warmup))o.warmup=[];if(!o.cardio)o.cardio={training:{min:10,max:12,text:''},off:{min:40,max:60,text:''}};if(!o.weeklyTargets)o.weeklyTargets={};
  return er;}

let DL;async function download(filename,data){if(IN_APP){try{if(await nativeShareFile(filename,data))return;}catch(e){toast(L('Não foi possível salvar o arquivo','Could not save the file'));return;}}try{if(DL===undefined)DL=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;if(!DL)throw new Error('na');

const LIFTS=['agachamento','supino-reto','supino-inclinado-halteres','stiff','remada-curvada','leg-press'];

function firstWorkout(){const d=S.sessions.filter(s=>s.type==='workout').map(s=>s.date).sort();return d[0]||null;}
function consistencyFrom(start){const t=today();let pl=0;for(let d=start>S.plan.startDate?start:S.plan.startDate;d<=t;d=addD(d,1)){if(dayPlan(d).type==='workout')pl++;}
  const dn=S.sessions.filter(s=>s.type==='workout'&&s.date>=start&&s.date<=t).length;return pl?Math.min(1,dn/pl):null;}
function liftSets(id,from,to){const out=[];S.sessions.forEach(s=>{if(s.type!=='workout'||!s.exercises||s.date<from||s.date>to)return;const e=s.exercises.find(x=>x.id===id&&!x.swapped);if(!e)return;e.sets.forEach(x=>{if(x.done&&isMain(x)&&num(x.kg)>0&&num(x.reps))out.push({kg:num(x.kg),r:num(x.reps)});});});return out;}

function levelCheck(){const p=S.profile,lv=p.level,t=today(),f=firstWorkout();const wk=f?Math.floor(dd(t,f)/7):0;const cons=f?consistencyFrom(f):null;const pct=v=>v==null?'—':Math.round(v*100)+'%';const items=[];let next=null;
  const weeksItem=(n)=>items.push({ok:wk>=n,label:L(`${n} semanas de treino registradas`,`${n} weeks of logged training`),val:`${wk}/${n}`});
  const consItem=(m)=>items.push({ok:cons!=null&&cons>=m,label:L(`Consistência de ${Math.round(m*100)}% ou mais`,`${Math.round(m*100)}%+ consistency`),val:pct(cons)});
  if(lv==='returning'){next='intermediate';weeksItem(8);consItem(.75);
    const pb=p.pastBests||{};const rs=Object.keys(pb).filter(k=>pb[k]>0).map(k=>{const b=bestKgIn(k,addD(t,-28),t);return b?b/pb[k]:null;}).filter(x=>x!=null);
    if(Object.keys(pb).some(k=>pb[k]>0)){const r=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;items.push({ok:r!=null&&r>=.85,label:L('Recuperar ~85% das cargas antigas (média, últimas 4 semanas)','Recover ~85% of previous loads (average, last 4 weeks)'),val:pct(r)});}}
  else if(lv==='beginner'){next='intermediate';weeksItem(26);consItem(.7);
    const g=LIFTS.map(id=>{const a=bestE1In(id,f||t,addD(f||t,28)),b=bestE1In(id,addD(t,-28),t);return a&&b?b/a-1:null;}).filter(x=>x!=null);const gr=g.length?g.reduce((a,b)=>a+b,0)/g.length:null;
    items.push({ok:gr!=null&&gr>=.2,label:L('Força 20%+ maior que no 1º mês (1RM estimado)','Strength 20%+ above month 1 (estimated 1RM)'),val:gr==null?'—':'+'+Math.round(gr*100)+'%'});}
  else if(lv==='intermediate'){next='advanced';weeksItem(52);const bw=curWeight();const F=p.sex==='F';
    const sq=bestE1In('agachamento',addD(t,-56),t),bp=bestE1In('supino-reto',addD(t,-56),t);

    items.push({ok:bp!=null&&bp>=(F?0.85:1.3)*bw,label:L(`Supino reto ≥ ${F?'0,85':'1,3'}× o peso corporal (1RM est.)`,`Bench ≥ ${F?'0.85':'1.3'}× bodyweight (est. 1RM)`),val:bp?fmtN(bp/bw,2)+'×':'—'});
    const g=LIFTS.map(id=>{const a=bestE1In(id,addD(t,-112),addD(t,-84)),b=bestE1In(id,addD(t,-28),t);return a&&b?b/a-1:null;}).filter(x=>x!=null);const gr=g.length?g.reduce((a,b)=>a+b,0)/g.length:null;
    items.push({ok:gr!=null&&gr<.02,label:L('Progressão lenta: < 2% de ganho em 12 semanas','Slow progress: < 2% gain in 12 weeks'),val:gr==null?'—':(gr>=0?'+':'')+fmtN(gr*100,1)+'%'});}
  return{next,items,ready:!!next&&items.length>0&&items.every(x=>x.ok)};}

async function hcStatus(){const p=HP();if(!p)return{state:'noplugin'};
  try{const a=await p.isAvailable();if(!a.available)return{state:'install',reason:a.reason||''};}catch(e){return{state:'install'};}
  try{const c=await p.checkAuthorization({read:HC_READ});return{state:(c.readAuthorized||[]).includes('steps')?'ok':'perm',granted:c.readAuthorized||[]};}catch(e){return{state:'perm',granted:[]};}}
async function hcConnect(){const p=HP();if(!p)return;
  try{const r=await p.requestAuthorization({read:HC_READ});H.mode='hc';hSave();ui.hcSt=null;
    if((r.readAuthorized||[]).includes('steps')){toast(L('Conectado ao Health Connect','Connected to Health Connect'));await hcSync(true);}
    else toast(L('Permissão de passos não concedida','Steps permission not granted'));}
  catch(e){toast(L('Não foi possível abrir o Health Connect','Could not open Health Connect'));}

let hBusy=false;
async function hcSync(force){const p=HP();if(!p||hBusy)return;if(!force&&Date.now()-(H.sync||0)<10*60e3)return;hBusy=true;
  try{const now=new Date(),st=new Date();st.setHours(0,0,0,0);st.setDate(st.getDate()-29);
    const range={startDate:st.toISOString(),endDate:now.toISOString()};
    const agg=async(dt,ag)=>{try{return (await p.queryAggregated(Object.assign({dataType:dt,bucket:'day',aggregation:ag},range))).samples||[];}catch(e){return null;}};
    const put=(arr,k,f)=>{if(!arr)return;arr.forEach(s=>{const v=s.value;if(v==null||!isFinite(v))return;hDay(localYmd(s.startDate))[k]=f(v);});};
    const steps=await agg('steps','sum');if(steps===null)throw new Error(L('sem acesso aos passos','no access to steps'));
    put(steps,'steps',v=>Math.round(v));
    put(await agg('distance','sum'),'km',v=>Math.round(v/10)/100);
    put(await agg('calories','sum'),'kcal',v=>Math.round(v));
    if(H.opts.hr)put(await agg('restingHeartRate','average'),'rhr',v=>Math.round(v));
    if(H.opts.sleep){try{const r=await p.readSamples({dataType:'sleep',startDate:new Date(st.getTime()-864e5).toISOString(),endDate:range.endDate,limit:300});const per={};
      (r.samples||[]).forEach(s=>{let m=s.value||0;if(s.stages&&s.stages.length){const a=s.stages.filter(x=>x.stage!=='awake'&&x.stage!=='inBed').reduce((t,x)=>t+(x.durationMinutes||0),0);if(a>0)m=a;}const d=localYmd(s.endDate);per[d]=(per[d]||0)+m;});
      Object.keys(per).forEach(d=>{hDay(d).sleep=Math.round(per[d]);});}catch(e){}}
    if(H.opts.weight){try{const r=await p.readSamples(Object.assign({dataType:'weight',limit:200,ascending:true},range));let ch=false;
      (r.samples||[]).forEach(s=>{const d=localYmd(s.startDate),kg=Math.round(s.value*10)/10;if(!(kg>20&&kg<400))return;const ex=S.body.find(b=>b.date===d);
        if(!ex){S.body.push({date:d,kg,src:'hc'});ch=true;}else if(ex.src==='hc'&&ex.kg!==kg){ex.kg=kg;ch=true;}});
      if(ch){S.body.sort((a,b)=>a.date.localeCompare(b.date));persist('body');}}catch(e){}}
    try{const t0=new Date();t0.setHours(0,0,0,0);const r=await p.readSamples({dataType:'steps',startDate:t0.toISOString(),endDate:range.endDate,limit:300});const cnt={};
      (r.samples||[]).forEach(s=>{const n=srcLabel(s);if(n)cnt[n]=(cnt[n]||0)+(s.value||0);});const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(top)H.src=top[0];}catch(e){}
    H.sync=Date.now();H.err='';hPrune();hSave();}
  catch(e){H.err=String(e&&e.message||e);hSave();}
  finally{hBusy=false;}}

/* Sensor de passos do celular: conta desde o último boot; dividimos cada intervalo entre os dias pelas horas acordadas (6h–24h) */
function spreadSteps(n,from,to){const parts=[];let tot=0;const d=new Date(from);d.setHours(0,0,0,0);
  while(d.getTime()<to){const a=new Date(d);a.setHours(6,0,0,0);const b=new Date(d);b.setDate(b.getDate()+1);
    const w=Math.max(0,Math.min(b.getTime(),to)-Math.max(a.getTime(),from));parts.push([ymd(d),w]);tot+=w;d.setDate(d.getDate()+1);}
  if(!tot){const k=localYmd(to);hDay(k).psteps=(hDay(k).psteps||0)+n;return;}
  let left=n,best=0;parts.forEach((x,i)=>{if(x[1]>parts[best][1])best=i;});
  parts.forEach(x=>{const v=Math.floor(n*x[1]/tot);x[2]=v;left-=v;});parts[best][2]+=left;
  parts.forEach(x=>{if(x[2]>0)hDay(x[0]).psteps=(hDay(x[0]).psteps||0)+x[2];});}
async function phoneRead(){const p=SCP();if(!p)return false;let r;
  try{r=await p.read();}catch(e){const m=String(e&&e.message||e);H.err=m==='timeout'?L('O sensor não respondeu. Ande alguns passos e atualize.','The sensor did not respond. Walk a few steps and refresh.'):m==='permission'?L('Falta a permissão de atividade física.','Physical activity permission is missing.'):m;hSave();return false;}
  const now=Date.now(),last=H.phone;
  if(last){const reboot=Math.abs((r.bootTime||0)-(last.boot||0))>5*60e3||r.steps<last.steps;
    const delta=reboot?r.steps:r.steps-last.steps,from=reboot?Math.max(r.bootTime||last.ts,last.ts):last.ts;
    if(delta>0&&delta<200000)spreadSteps(Math.round(delta),from,now);}
  H.phone={ts:now,steps:r.steps,boot:r.bootTime};H.sync=now;H.err='';hPrune();hSave();return true;}
async function phoneConnect(){const p=SCP();if(!p){toast(L('Disponível só no app Android','Android app only'));return;}
  try{const a=await p.isAvailable();if(!a.available){toast(L('Este celular não tem sensor de passos','This phone has no step sensor'));return;}
    const g=await p.requestPermission();if(!g.granted){toast(L('Permissão de atividade física negada','Physical activity permission denied'));return;}
    H.mode='phone';H.phone=null;hSave();await phoneRead();toast(L('Contador do celular ativado','Phone counter enabled'));}
  catch(e){toast(L('Não foi possível ativar o contador','Could not enable the counter'));}
  render();}

/* Recuperação (sono e FC de repouso) — entra nos alertas de deload */
function recovery(){if(!IN_APP||H.mode!=='hc')return null;const t=today();const vals=(k,a,b)=>{const o=[];for(let i=a;i<=b;i++){const v=(H.days[addD(t,-i)]||{})[k];if(v!=null)o.push(v);}return o;};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const n4=H.opts.sleep?vals('sleep',0,3):[],short=n4.filter(m=>m<360).length;
  const r3=H.opts.hr?avg(vals('rhr',0,2)):null,rb=H.opts.hr?vals('rhr',4,30):[],base=rb.length>=7?avg(rb):null;
  const sleepFlag=n4.length>=3&&short>=3,rhrFlag=!!(base&&r3&&r3>=base+5);
  const s7=avg(H.opts.sleep?vals('sleep',0,6):[]),h7=avg(H.opts.hr?vals('rhr',0,6):[]);
  return{sleepFlag,rhrFlag,short,r3,base,s7,h7,level:(sleepFlag?1:0)+(rhrFlag?1:0)};}

/* ---------- techniques ---------- */
ST.drop={n:['Drop set','Drop set'],short:['drop','drop'],info:['<b>Drop set</b>: logo após a série anterior, <b>sem descanso</b>, reduza ~20% da carga e faça o máximo de repetições com boa técnica.','<b>Drop set</b>: right after the previous set, <b>no rest</b>, drop ~20% of the load and do as many good reps as you can.']};
ST.rp={n:['Rest-pause','Rest-pause'],short:['rest-pause','rest-pause'],info:['<b>Rest-pause</b>: descanse só ~15 s e faça uma mini-série com a <b>mesma carga</b>, até perto da falha. Ótimo para acumular volume em pouco tempo.','<b>Rest-pause</b>: rest only ~15 s and do a mini-set with the <b>same load</b>, close to failure. Great for extra volume in little time.']};
BK.drop=[['drop','drops'],['drop set','drop sets']];BK.rp=[['rest-pause','rest-pauses'],['rest-pause','rest-pauses']];
const isMain=s=>['top','backoff','working','final'].includes(stype(s));
const TECHS=[['','Nenhuma','None'],['drop','Drop set','Drop set'],['restpause','Rest-pause','Rest-pause']];

/* ---------- measurements ---------- */
const MFIELDS=[['waist','Cintura','Waist','cm'],['abdomen','Abdômen','Abdomen','cm'],['chest','Peito','Chest','cm'],['hip','Quadril','Hips','cm'],['arm','Braço','Arm','cm'],['thigh','Coxa','Thigh','cm'],['calf','Panturrilha','Calf','cm'],['bf','% gordura','Body fat','%']];
const mName=k=>{const f=MFIELDS.find(x=>x[0]===k);return f?L(f[1],f[2]):k;};
const mUnit=k=>{const f=MFIELDS.find(x=>x[0]===k);return f?f[3]:'';};
const FREQ=[['weekly','Semanal','Weekly',7],['biweekly','Quinzenal','Every 2 weeks',14],['monthly','Mensal','Monthly',28],['off','Desligado','Off',0]];
const mDay=()=>{const v=S.prefs.measureDay;return v==null?4:+v;};
function measureDue(){const fr=FREQ.find(x=>x[0]===(S.prefs.measureFreq||'weekly'));if(!fr||!fr[3])return null;const t=today();
  let anchor=S.plan.startDate<t?S.plan.startDate:t;anchor=addD(anchor,(mDay()-pd(anchor).getDay()+7)%7);if(anchor>t)return null;
  const k=Math.floor(dd(t,anchor)/fr[3]);return addD(anchor,k*fr[3]);}
function measurePending(){const due=measureDue();if(!due)return false;return !S.measures.some(m=>m.date>=addD(due,-1));}
function measureLate(){return measurePending()&&today()>measureDue();}
function latestMeasure(k,before){const l=[...S.measures].filter(m=>m[k]!=null&&(!before||m.date<before)).sort((a,b)=>a.date.localeCompare(b.date));return l.length?l[l.length-1]:null;}
function measureForm(){const t=today();const last=[...S.measures].sort((a,b)=>a.date.localeCompare(b.date)).pop()||{};
  return `<div class="field"><label>${L('Data','Date')}</label><input id="ms-date" value="${t}"></div><div class="g2">${MFIELDS.map(f=>`<div class="field"><label>${L(f[1],f[2])} (${f[3]})</label><input id="ms-${f[0]}" inputmode="decimal" placeholder="${last[f[0]]!=null?fmtN(last[f[0]]):''}"></div>`).join('')}</div>
   <div class="sub">${L('Fita métrica justa, sem apertar, de manhã e em jejum. Cintura: na altura do umbigo, após expirar. Braço e coxa: no ponto mais largo, sempre do mesmo lado. Preencha só o que medir.','Snug tape, no squeezing, in the morning and fasted. Waist: at the navel after exhaling. Arm and thigh: widest point, always the same side. Fill only what you measure.')}</div>`;}
function openMeasureForm(){modal(L('Registrar medidas','Log measurements'),measureForm(),[{l:L('Cancelar','Cancel'),fn:closeModal},{l:L('Salvar','Save'),c:'primary',fn:()=>{
  const d=$('#ms-date').value.trim();if(!isDate(d)){toast(L('Use AAAA-MM-DD','Use YYYY-MM-DD'));return;}const rec={date:d};let n=0;
  MFIELDS.forEach(f=>{const v=num($('#ms-'+f[0]).value);if(v!=null&&v>0){rec[f[0]]=v;n++;}});if(!n){toast(L('Preencha ao menos uma medida','Fill at least one measurement'));return;}
  const old=S.measures.find(m=>m.date===d);S.measures=S.measures.filter(m=>m.date!==d);S.measures.push(Object.assign({},old||{},rec));S.measures.sort((a,b)=>a.date.localeCompare(b.date));persist('measures');closeModal();ui.tab='prog';render();toast(L('Medidas salvas','Measurements saved'));}}]);}
function renderMeasures(){const ms=[...S.measures].sort((a,b)=>a.date.localeCompare(b.date));const fr=FREQ.find(x=>x[0]===(S.prefs.measureFreq||'weekly'));
  let h=`<div class="card"><div class="row"><div class="grow"><div class="hd" style="font-size:20px">${L('Medidas corporais','Body measurements')}</div><div class="sub">${fr&&fr[3]?L(fr[1],fr[2])+' · '+dowName(mDay()):L('Lembrete desligado','Reminder off')}</div></div><button class="btn sm outline" data-act="msadd">+ ${L('Medidas','Measure')}</button></div>`;
  if(measurePending())h+=`<div class="note-box" style="color:var(--redTx);font-weight:600">${today()===measureDue()?L('Hoje é dia de medir.','Today is measurement day.'):L('Medidas atrasadas desde ','Measurements overdue since ')+fmtLong(measureDue())+'.'}</div>`;
  if(!ms.length)return h+`<div class="empty">${L('Nenhuma medida ainda. A primeira vira sua referência.','No measurements yet. The first one is your baseline.')}</div></div>`;
  const keys=MFIELDS.map(f=>f[0]).filter(k=>ms.some(m=>m[k]!=null));if(!ui.msSel||!keys.includes(ui.msSel))ui.msSel=keys.includes('waist')?'waist':keys[0];
  h+=`<div class="mtab"><div class="mrow mh"><span></span><span>${L('Atual','Now')}</span><span>${L('Anterior','Prev.')}</span><span>${L('Início','Start')}</span></div>`;
  keys.forEach(k=>{const cur=latestMeasure(k),prev=cur?latestMeasure(k,cur.date):null,first=ms.find(m=>m[k]!=null);const dv=(a,b)=>a&&b?(a[k]-b[k]):null;
    const f=(v)=>v==null?'—':`<b class="${v<0?'dn':v>0?'up':''}">${v>0?'+':''}${fmtN(v)}</b>`;
    h+=`<button class="mrow ${ui.msSel===k?'on':''}" data-act="mssel" data-v="${k}"><span>${esc(mName(k))}</span><span><b>${fmtN(cur[k])}</b> ${mUnit(k)}</span><span>${f(dv(cur,prev))}</span><span>${f(first&&first.date!==cur.date?dv(cur,first):null)}</span></button>`;});
  h+=`</div>${lineChart([{pts:ms.filter(m=>m[ui.msSel]!=null).map(m=>({x:m.date,y:m[ui.msSel]})),color:'var(--red)',w:3,dots:true}])}<div class="sub" style="text-align:center">${esc(mName(ui.msSel))} (${mUnit(ui.msSel)}) · ${L('toque numa linha para ver o gráfico','tap a row to chart it')}</div>`;
  const w=latestMeasure('waist');if(w){const r=w.waist/(S.profile.altura||176);h+=`<div class="note-box">${L('Relação cintura/altura: ','Waist-to-height ratio: ')}<b style="color:var(--tx)">${fmtN(r,2)}</b> · ${r<0.5?L('abaixo de 0,5 (faixa saudável)','below 0.5 (healthy range)'):L('meta: abaixo de 0,5','goal: below 0.5')}</div>`;}
  return h+'</div>';}

  S.prefs.photoAsk=t;persist('prefs');const both=ph&&me;

/* ---------- consistency ---------- */
function weekStats(ws){let planned=0,done=0;const t=today();for(let i=0;i<7;i++){const d=addD(ws,i);if(d>=S.plan.startDate&&dayPlan(d).type==='workout'&&d<=t)planned++;}
  let full=0;for(let i=0;i<7;i++){const d=addD(ws,i);if(d>=S.plan.startDate&&dayPlan(d).type==='workout')full++;}
  done=S.sessions.filter(s=>s.type==='workout'&&s.date>=ws&&s.date<=addD(ws,6)).length;return{planned,full,done};}
function consistency(){const cur=weekStart(today());const weeks=[];for(let k=7;k>=0;k--){const ws=addD(cur,-7*k);weeks.push(Object.assign({ws},weekStats(ws)));}
  let streak=0;for(let k=weeks.length-1;k>=0;k--){const w=weeks[k];if(w.full===0&&w.done===0)continue;const isCur=w.ws===cur;
    if(w.done>=w.full&&w.full>0){streak++;continue;}if(isCur)continue;break;}
  const m0=today().slice(0,8)+'01';let mp=0,md=0;for(let d=m0;d<=today();d=addD(d,1)){if(d>=S.plan.startDate&&dayPlan(d).type==='workout')mp++;}
  md=S.sessions.filter(s=>s.type==='workout'&&s.date>=m0&&s.date<=today()).length;
  return{weeks,streak,mp,md,total:S.sessions.filter(s=>s.type==='workout').length};}
function renderConsistency(){const c=consistency();const pct=c.mp?Math.min(100,Math.round(c.md/c.mp*100)):null;
  let h=`<div class="card"><div class="hd" style="font-size:20px">${L('Consistência','Consistency')}</div>
   <div class="kv"><div><b>${c.streak}</b><span>${L('semanas seguidas','weeks in a row')}</span></div><div><b>${pct==null?'—':pct+'%'}</b><span>${L('do mês cumprido','of month done')}</span></div><div><b>${c.total}</b><span>${L('treinos no total','total workouts')}</span></div></div>
   <div class="wbars">${c.weeks.map(w=>{const p=w.full?Math.min(100,w.done/w.full*100):0;return `<div class="wb ${w.ws===weekStart(today())?'cur':''}"><div class="wbt"><i style="height:${w.full?p:0}%" class="${w.done>=w.full&&w.full?'ok':''}"></i></div><b>${w.done}/${w.full||0}</b><span>${fmtD(w.ws)}</span></div>`;}).join('')}</div>
   <div class="sub" style="margin-top:6px">${L('Treinos feitos / planejados por semana (últimas 8).','Workouts done / planned per week (last 8).')}</div></div>`;
  return h;}

/* ---------- plateau / deload alerts ---------- */
function exSeries(id){return S.sessions.filter(s=>s.type==='workout'&&s.exercises).sort((a,b)=>a.date.localeCompare(b.date)||(a.endedAt||0)-(b.endedAt||0)).map(s=>{const e=s.exercises.find(x=>x.id===id);if(!e)return null;
  const d=e.sets.filter(x=>x.done&&isMain(x)&&num(x.kg)!=null&&num(x.reps));if(!d.length)return null;const top=d.find(x=>stype(x)==='top')||d[0];
  return{date:s.date,best:Math.max(...d.map(x=>e1rm(num(x.kg),num(x.reps)))),topKg:num(top.kg),rpe:top.rpe,name:P(e,'name')};}).filter(Boolean);}
function alerts(){const ids=new Set();Object.values(S.plan.workouts).forEach(w=>w.exercises.forEach(e=>{if(e.unit!=='s')ids.add(e.id);}));const out=[];
  ids.forEach(id=>{const sr=exSeries(id);if(sr.length>=4){const last3=sr.slice(-3),ref=sr[sr.length-4];if(Math.max(...last3.map(x=>x.best))<=ref.best*1.005)out.push({kind:'plateau',id,name:sr[sr.length-1].name,n:3});}
    if(sr.length>=2){const a=sr[sr.length-2],b=sr[sr.length-1];if(a.rpe!=null&&b.rpe!=null&&b.topKg<=a.topKg&&b.rpe-a.rpe>=1)out.push({kind:'fatigue',id,name:b.name,from:a.rpe,to:b.rpe});}});

function sessionStats(s){let vol=0,sets=0;s.exercises.forEach(e=>e.sets.forEach(x=>{if(x.done&&isWork(x)){sets++;vol+=(num(x.kg)||0)*(e.unit==='s'?0:(num(x.reps)||0));}}));
  const prev=S.sessions.filter(o=>o.type==='workout'&&o.workout===s.workout&&o.id!==s.id&&(o.date<s.date||(o.date===s.date&&(o.endedAt||0)<(s.endedAt||0)))).sort((a,b)=>b.date.localeCompare(a.date))[0];
  let pvol=null;if(prev){pvol=0;prev.exercises.forEach(e=>e.sets.forEach(x=>{if(x.done&&isWork(x))pvol+=(num(x.kg)||0)*(e.unit==='s'?0:(num(x.reps)||0));}));}
  const prs=[];s.exercises.forEach(e=>{if(e.unit==='s')return;const d=e.sets.filter(x=>x.done&&isMain(x)&&num(x.kg)>0&&num(x.reps));if(!d.length)return;
    const best=Math.max(...d.map(x=>e1rm(num(x.kg),num(x.reps)))),heavy=Math.max(...d.map(x=>num(x.kg)));
    let pb=0,ph=0,had=false;S.sessions.forEach(o=>{if(o.type!=='workout'||o.id===s.id||!o.exercises)return;if(o.date>s.date||(o.date===s.date&&(o.endedAt||0)>=(s.endedAt||0)))return;const oe=o.exercises.find(x=>x.id===e.id);if(!oe)return;
      oe.sets.filter(x=>x.done&&isMain(x)&&num(x.kg)>0&&num(x.reps)).forEach(x=>{had=true;pb=Math.max(pb,e1rm(num(x.kg),num(x.reps)));ph=Math.max(ph,num(x.kg));});});
    if(had&&best>pb+0.05)prs.push({name:exName(e),kind:'1rm',v:best,d:best-pb});
    if(had&&heavy>ph)prs.push({name:exName(e),kind:'load',v:heavy,d:heavy-ph});});
  return{vol,sets,pvol,prs,dur:s.durationMin||0};}
