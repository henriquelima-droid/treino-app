name: Build de teste (sem release)

on:
  push:
    branches: [ teste ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (pré-instalado no runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          APP_BUILD: "12"
          APP_VERSION_NAME: "1.0.13-teste"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GrowUp-teste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrowUp-teste
          path: GrowUp-teste.apk

